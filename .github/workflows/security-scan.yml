name: Security Scan

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan (manifest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Trivy scan - blocking, fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy scan - report, all MEDIUM+ including unfixed
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"

  trivy-image:
    name: Trivy Image Scan (as shipped)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image (local load only, not pushed)
        run: |
          set -euo pipefail
          docker buildx build --load -t action-security-scan:local .

      - name: Trivy scan - blocking, fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: action-security-scan:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

      - name: Trivy scan - report, all MEDIUM+ including unfixed
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: action-security-scan:local
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"

  python-dependencies:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          audit_output="$(mktemp)"
          audit_status=0

          python -m pip_audit -r requirements.txt --format=json --aliases=off --desc=off --output "$audit_output" || audit_status=$?

          if [[ ! -s "$audit_output" ]]; then
          echo "pip-audit did not produce JSON output" >&2
          exit "${audit_status:-1}"
          fi

          python - "$audit_output" <<'PY'
          import json
          import sys
          from pathlib import Path

          # A fix existing upstream doesn't mean it's installable here -- a
          # pin elsewhere in requirements.txt can put it out of reach. Each
          # entry needs its own reason and a way to notice when it stops
          # applying, so this only ever silences the exact (package, id)
          # pair named, never the package as a whole.
          ACKNOWLEDGED = {
            ("sanic", "CVE-2026-85078"): (
              "fix is 24.12.1+; rasa-sdk==3.14.2 pins sanic<23.0, and no "
              "rasa-sdk release between 3.14.2 and 3.20.0 raises that "
              "ceiling (3.20.0 jumps straight to sanic>=25.12, its own "
              "larger upgrade). Revisit on the next rasa-sdk bump."
            ),
          }

          payload = json.loads(Path(sys.argv[1]).read_text())
          actionable = []
          unfixed = []
          acknowledged = []

          for dependency in payload.get("dependencies", []):
            name = dependency.get("name", "<unknown>")
            version = dependency.get("version", "<unknown>")
            for vulnerability in dependency.get("vulns", []):
              fix_versions = vulnerability.get("fix_versions") or []
              vuln_id = vulnerability.get("id", "<unknown>")
              entry = {
                "name": name,
                "version": version,
                "id": vuln_id,
                "fix_versions": fix_versions,
              }
              reason = ACKNOWLEDGED.get((name, vuln_id))
              if reason:
                entry["reason"] = reason
                acknowledged.append(entry)
              elif fix_versions:
                actionable.append(entry)
              else:
                unfixed.append(entry)

          # Report every vulnerability found -- including ones with no fix
          # yet, and ones acknowledged below -- so they stay visible instead
          # of being silently dropped. Only the fixable, unacknowledged ones
          # (below) fail the build.
          if unfixed:
            print("Python vulnerabilities with no known fix yet (report only, does not fail the build):")
            for vulnerability in unfixed:
              print(f"- {vulnerability['name']} {vulnerability['version']}: {vulnerability['id']}")
            print()

          if acknowledged:
            print("Python vulnerabilities with a fix that isn't installable here yet (report only, does not fail the build):")
            for vulnerability in acknowledged:
              fixes = ", ".join(vulnerability["fix_versions"])
              print(
                f"- {vulnerability['name']} {vulnerability['version']}: "
                f"{vulnerability['id']} -> {fixes} ({vulnerability['reason']})"
              )
            print()

          if not actionable:
            print("No actionable Python vulnerabilities found.")
            sys.exit(0)

          print("Python vulnerabilities with known fixes:")
          for vulnerability in actionable:
            fixes = ", ".join(vulnerability["fix_versions"])
            print(
              f"- {vulnerability['name']} {vulnerability['version']}: "
              f"{vulnerability['id']} -> {fixes}"
            )

          sys.exit(1)
          PY