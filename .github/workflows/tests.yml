name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Placeholders: several modules read these at import time; no test calls the services.
      KEYCLOAK_ISSUER: http://keycloak.invalid/realms/ci
      KEYCLOAK_CLIENT_ID: ci
      KEYCLOAK_CLIENT_SECRET: ci
      RASA_PROXY_URL: http://webapp.invalid/api/rasa-proxy
      RASA_PROXY_GRAPHQL_TARGET: graphql
      RASA_PROXY_ANALYTICS_TARGET: analytics
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      LLM_API_KEY: ci-placeholder
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests -q -p no:cacheprovider
